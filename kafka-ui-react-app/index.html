<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- Favicons -->
    <link rel="icon" href="<%= PUBLIC_PATH %>/favicon/favicon.ico" sizes="any" />
    <link rel="icon" href="<%= PUBLIC_PATH %>/favicon/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="<%= PUBLIC_PATH %>/favicon/apple-touch-icon.png" />
    <link rel="manifest" href="<%= PUBLIC_PATH %>/manifest.json" />

    <title>UI for Apache Kafka</title>
    <script type="text/javascript">
      window.basePath = '<%= PUBLIC_PATH %>';

      window.__assetsPathBuilder = function (importer) {
        return window.basePath+ "/" + importer;
      };
    </script>
    <style>
      @font-face {
        font-family: 'Inter';
        src: url('<%= PUBLIC_PATH %>/fonts/Inter-Medium.ttf') format('truetype');
        font-weight: 500;
        font-display: swap;
      }

      @font-face {
        font-family: 'Inter';
        src: url('<%= PUBLIC_PATH %>/fonts/Inter-Regular.ttf') format('truetype');
        font-weight: 400;
        font-display: swap;
      }

      @font-face {
        font-family: 'Roboto Mono';
        src: url('<%= PUBLIC_PATH %>/fonts/RobotoMono-Medium.ttf') format('truetype');
        font-weight: 500;
        font-display: swap;
      }

      @font-face {
        font-family: 'Roboto Mono';
        src: url('<%= PUBLIC_PATH %>/fonts/RobotoMono-Regular.ttf') format('truetype');
        font-weight: 400;
        font-display: swap;
      }

      /* Shown until React mounts and replaces #root content */
      .initial-loader {
        display: flex;
        justify-content: center;
        padding-top: 15%;
      }
      .initial-loader > div {
        width: 80px;
        height: 80px;
        box-sizing: border-box;
        border: 10px solid #4C4CFF;
        border-bottom-color: #FFFFFF;
        border-radius: 50%;
        animation: initial-loader-spin 1.3s linear infinite;
      }
      @media (prefers-color-scheme: dark) {
        body { background-color: #171A1C; }
        .initial-loader > div { border-bottom-color: #171A1C; }
      }
      @keyframes initial-loader-spin {
        to { transform: rotate(360deg); }
      }
    </style>
  </head>

  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root">
      <div class="initial-loader" role="progressbar"><div></div></div>
    </div>
    <script type="module" src="/src/index.tsx"></script>
  </body>
</html>
